<title>Un Desmadre Bien Bonito</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --night: #170b2e;
    --night-2: #241143;
    --panel: #2f1550;
    --panel-hi: #3c1c68;
    --hot: #ff2f78;
    --hot-dim: #7a1740;
    --cyan: #23e6d2;
    --cyan-dim: #0f5c56;
    --yellow: #ffcd3c;
    --cream: #fdf3ff;
    --dim: #b9a4d9;
  }

  *{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(600px 500px at 18% 12%, rgba(255,47,120,0.22), transparent 60%),
      radial-gradient(650px 550px at 85% 20%, rgba(35,230,210,0.18), transparent 60%),
      radial-gradient(700px 600px at 50% 100%, rgba(255,205,60,0.10), transparent 55%),
      var(--night);
    color: var(--cream);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 40px 20px;
    text-wrap: balance;
  }

  h1{ text-wrap: balance; }

  .stage{
    width:100%;
    max-width: 480px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 26px;
  }

  .eyebrow{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    text-align:center;
  }

  .wordmark{
    font-family:'Bungee', 'Manrope', sans-serif;
    font-size: clamp(30px, 8vw, 46px);
    line-height: 1.08;
    text-align:center;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .wordmark .l1{ color: var(--hot); text-shadow: 0 0 22px rgba(255,47,120,0.55); }
  .wordmark .l2{ color: var(--yellow); text-shadow: 0 0 22px rgba(255,205,60,0.45); }
  .wordmark .l3{ color: var(--cyan); text-shadow: 0 0 22px rgba(35,230,210,0.5); }

  .badge{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--dim);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background: #6b5f8a;
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  .stage.is-playing .dot{
    background: var(--hot);
    box-shadow: 0 0 10px 2px rgba(255,47,120,0.8);
    animation: dotpulse 1.4s ease-in-out infinite;
  }
  @keyframes dotpulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.5; } }

  /* ---- Speaker / play control ---- */
  .speaker{
    position: relative;
    width: 220px;
    height: 220px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .ring{
    position:absolute;
    inset:0;
    border-radius:50%;
    border: 2px solid rgba(255,47,120,0.35);
    opacity:0;
  }
  .stage.is-playing .ring{ animation: ripple 2.4s ease-out infinite; }
  .ring.r2{ animation-delay: 0.8s !important; }
  .ring.r3{ animation-delay: 1.6s !important; }
  @keyframes ripple{
    0%{ transform: scale(0.72); opacity: 0.65; border-color: rgba(255,47,120,0.55); }
    70%{ opacity: 0.12; border-color: rgba(35,230,210,0.35); }
    100%{ transform: scale(1.28); opacity: 0; }
  }

  .play-btn{
    position:relative;
    z-index:2;
    width: 128px; height: 128px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    background: radial-gradient(circle at 34% 28%, #ff5c94 0%, var(--hot) 55%, #b81654 100%);
    box-shadow:
      0 14px 30px -8px rgba(255,47,120,0.55),
      0 0 0 6px rgba(255,255,255,0.05) inset;
    display:flex; align-items:center; justify-content:center;
    color: var(--cream);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .play-btn:hover{ transform: scale(1.03); }
  .play-btn:active{ transform: scale(0.97); }
  .play-btn:focus-visible{ outline: 3px solid var(--cyan); outline-offset: 4px; }
  .play-btn svg{ width: 42px; height: 42px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.35)); }

  .status{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--dim);
    text-align:center;
    min-height: 16px;
  }
  .stage.is-tuning .status::after{ content:"…"; }

  /* ---- Equalizer ---- */
  .eq{
    display:flex;
    align-items:flex-end;
    justify-content:center;
    gap: 6px;
    height: 34px;
  }
  .eq i{
    display:block;
    width: 6px;
    border-radius: 3px;
    background: linear-gradient(180deg, var(--cyan), var(--cyan-dim));
    height: 6px;
    animation-play-state: paused;
    opacity: 0.3;
  }
  .stage.is-playing .eq i{ animation-play-state: running; opacity: 1; }
  .eq i:nth-child(1){ animation: eq1 1.05s ease-in-out infinite; }
  .eq i:nth-child(2){ animation: eq2 0.85s ease-in-out infinite; }
  .eq i:nth-child(3){ animation: eq3 1.25s ease-in-out infinite; }
  .eq i:nth-child(4){ animation: eq4 0.7s ease-in-out infinite; }
  .eq i:nth-child(5){ animation: eq5 1.1s ease-in-out infinite; }
  .eq i:nth-child(6){ animation: eq2 1.3s ease-in-out infinite; }
  .eq i:nth-child(7){ animation: eq3 0.9s ease-in-out infinite; }
  @keyframes eq1{ 0%,100%{height:6px;} 50%{height:30px;} }
  @keyframes eq2{ 0%,100%{height:10px;} 50%{height:20px;} }
  @keyframes eq3{ 0%,100%{height:4px;} 50%{height:34px;} }
  @keyframes eq4{ 0%,100%{height:14px;} 50%{height:9px;} }
  @keyframes eq5{ 0%,100%{height:8px;} 50%{height:24px;} }

  /* ---- Volume ---- */
  .vol-row{
    display:flex;
    align-items:center;
    gap: 12px;
    width: 100%;
    max-width: 280px;
  }
  .vol-row svg{ width:18px; height:18px; color: var(--dim); flex:none; }
  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height: 6px;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--hot), var(--cyan));
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 18px; height: 18px;
    border-radius:50%;
    background: var(--cream);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,255,255,0.15);
    cursor:pointer;
    margin-top: -6px;
  }
  input[type="range"]::-moz-range-thumb{
    width: 18px; height: 18px;
    border: none;
    border-radius:50%;
    background: var(--cream);
    box-shadow: 0 1px 4px rgba(0,0,0,0.5), 0 0 0 3px rgba(255,255,255,0.15);
    cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{ height:6px; border-radius:4px; background:transparent; }
  input[type="range"]::-moz-range-track{ height:6px; border-radius:4px; background:transparent; }
  input[type="range"]:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 3px; }

  .footer{
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.05em;
    color: var(--dim);
    line-height: 1.7;
  }
  .footer b{ color: var(--cream); font-weight:700; }
  .footer a{ color: var(--cyan); }

  @media (prefers-reduced-motion: reduce){
    .stage.is-playing .ring,
    .stage.is-playing .dot,
    .eq i{ animation: none !important; }
  }

  @media (max-width: 360px){
    .speaker{ width: 190px; height: 190px; }
    .play-btn{ width: 108px; height: 108px; }
  }
</style>

<div class="stage" id="stage">
  <div class="eyebrow">Radio online &middot; sin cortes, sin redirecciones</div>

  <h1 class="wordmark">
    <span class="l1">UN DESMADRE</span><br>
    <span class="l2">BIEN</span> <span class="l3">BONITO</span>
  </h1>

  <div class="badge"><span class="dot" id="dot"></span><span id="badgeText">Fuera del aire</span></div>

  <div class="speaker">
    <span class="ring r1"></span>
    <span class="ring r2"></span>
    <span class="ring r3"></span>
    <button class="play-btn" id="playBtn" type="button" aria-label="Reproducir Un Desmadre Bien Bonito">
      <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
      <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
    </button>
  </div>

  <div class="status" id="status">Toca play para sintonizar</div>

  <div class="eq" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
  </div>

  <div class="vol-row">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 5V4L8 9zm11.5 3a3.5 3.5 0 0 0-2-3.16v6.32a3.5 3.5 0 0 0 2-3.16zM14 4.5v1.6c2.32.83 4 3.04 4 5.9s-1.68 5.07-4 5.9v1.6c3.2-.87 5.5-3.8 5.5-7.5s-2.3-6.63-5.5-7.5z"/></svg>
    <input type="range" id="volume" min="0" max="100" value="80" aria-label="Volumen">
  </div>

  <div class="footer">
    Creada por <b>José &amp; Ana</b><br>
    Transmisión en vivo &middot; suena directo en esta página
  </div>

  <audio id="stream" preload="none" src="/radio-relay"></audio>
</div>

<script>
  const STREAM_URL = 'https://my.groover.stream:8010/live';

  const audio = document.getElementById('stream');
  const stage = document.getElementById('stage');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  const status = document.getElementById('status');
  const badgeText = document.getElementById('badgeText');
  const volume = document.getElementById('volume');

  audio.volume = Number(volume.value) / 100;

  function setStatus(text, tuning){
    status.textContent = text;
    stage.classList.toggle('is-tuning', !!tuning);
  }

  playBtn.addEventListener('click', () => {
    if (audio.paused) {
      setStatus('Sintonizando', true);
      // Se pide la señal de nuevo cada vez, así siempre suena lo que está al aire.
      audio.src = STREAM_URL;
      audio.load();
      audio.play().catch(() => {
        setStatus('No se pudo conectar — toca para reintentar');
      });
    } else {
      audio.pause();
      audio.removeAttribute('src');
      audio.load();
    }
  });

  audio.addEventListener('waiting', () => setStatus('Sintonizando', true));

  audio.addEventListener('playing', () => {
    stage.classList.add('is-playing');
    playIcon.style.display = 'none';
    pauseIcon.style.display = '';
    playBtn.setAttribute('aria-label', 'Pausar Un Desmadre Bien Bonito');
    badgeText.textContent = 'En vivo';
    setStatus('Sonando ahora mismo');
  });

  audio.addEventListener('pause', () => {
    stage.classList.remove('is-playing');
    playIcon.style.display = '';
    pauseIcon.style.display = 'none';
    playBtn.setAttribute('aria-label', 'Reproducir Un Desmadre Bien Bonito');
    badgeText.textContent = 'Fuera del aire';
    if (!audio.error) setStatus('Toca play para sintonizar');
  });

  audio.addEventListener('error', () => {
    if (!audio.getAttribute('src')) return;
    stage.classList.remove('is-playing');
    badgeText.textContent = 'Sin señal';
    setStatus('Señal perdida — toca para reintentar');
  });

  volume.addEventListener('input', () => {
    audio.volume = Number(volume.value) / 100;
  });
</script>
